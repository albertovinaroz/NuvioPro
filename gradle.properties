#Kotlin
kotlin.code.style=official
# Was 8192M — on this 16GB machine, the Gradle daemon, Kotlin daemon and K/N compiler below were
# together configured for up to 32GB (12+8+12), well over physical RAM, which meant real swapping
# (confirmed: 7+GB of 8GB swap in use) rather than actual parallel headroom. Rebalanced so all
# three can run at once without forcing pages to disk.
# GC: ParallelGC trades power/heat for raw throughput — the right call on a plugged-in CI box, the
# wrong one on a laptop (confirmed native Apple Silicon throughout, not a Rosetta issue). G1 (JDK
# 21's own default otherwise) collects incrementally instead of stopping the world across every
# core it can grab, which is both the standard recommendation for interactive/build workloads and
# noticeably easier on battery.
kotlin.daemon.jvmargs=-Xmx4096M -Xms1024M -XX:MaxMetaspaceSize=2048m -XX:+UseG1GC
kotlin.native.jvmArgs=-Xmx6144M -XX:+UseG1GC
kotlin.mpp.enableCInteropCommonization=true
kotlin.build.report.output=file

#Gradle
org.gradle.jvmargs=-Xmx4096M -Xms1024M -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=2048m -XX:+UseG1GC
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
