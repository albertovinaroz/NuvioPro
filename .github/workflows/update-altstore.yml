name: Update AltStore sources

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to sync (empty = latest release)
        required: false
        type: string
      channel:
        description: Which source to update (auto = detect from assets, like a real release event)
        required: false
        type: choice
        options: [auto, pro, unmodified]
        default: auto
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: update-altstore-sources
  cancel-in-progress: false

env:
  SOURCE_REPO: ${{ github.repository }}
  EXPECTED_BUNDLE_ID_PRO: com.nuvio.pro
  EXPECTED_BUNDLE_ID_UNMODIFIED: com.nuvio.media

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update AltStore sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          python3 - <<'PY'
          import io
          import json
          import os
          import plistlib
          import re
          import sys
          import time
          import urllib.request
          import zipfile
          from pathlib import Path

          REPO = os.environ["SOURCE_REPO"]
          EXPECTED_BUNDLE_ID_PRO = os.environ["EXPECTED_BUNDLE_ID_PRO"]
          EXPECTED_BUNDLE_ID_UNMODIFIED = os.environ["EXPECTED_BUNDLE_ID_UNMODIFIED"]
          RELEASE_TAG = os.environ.get("RELEASE_TAG", "").strip()

          # "auto" (the default, and always what a real `release` event gets)
          # detects which of the two variants below is present, retrying for
          # a few seconds in case the asset upload hasn't landed yet. A
          # manual dispatch that already knows which channel it just
          # published skips both the guessing and the retry wait entirely —
          # it already knows the asset is there.
          CHANNEL = os.environ.get("CHANNEL", "").strip().lower() or "auto"
          if CHANNEL not in ("auto", "pro", "unmodified"):
              sys.exit(f"Unknown channel {CHANNEL!r}; expected auto, pro, or unmodified.")

          # Each release only ever carries ONE of these two variants (Full
          # releases and Pro releases are published separately), so a
          # release matching only one pattern is expected, not an error.
          SOURCES = [
              (
                  Path("store-pro.json"),
                  re.compile(r"^nuvio-.+-pro-release\.ipa$", re.IGNORECASE),
                  "Pro",
                  EXPECTED_BUNDLE_ID_PRO,
              ),
              (
                  Path("store-unmodified.json"),
                  re.compile(r"^nuvio-.+-unmodified-release\.ipa$", re.IGNORECASE),
                  "Unmodified",
                  EXPECTED_BUNDLE_ID_UNMODIFIED,
              ),
          ]

          API_HEADERS = {
              "User-Agent": "nuvio-altstore-updater",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          token = os.environ.get("GITHUB_TOKEN")
          if token:
              API_HEADERS["Authorization"] = f"Bearer {token}"


          def request_json(url):
              req = urllib.request.Request(
                  url,
                  headers=API_HEADERS
              )

              with urllib.request.urlopen(
                  req,
                  timeout=60
              ) as response:
                  return json.load(response)


          def download_asset(asset):
              headers = dict(API_HEADERS)
              headers["Accept"] = "application/octet-stream"

              req = urllib.request.Request(
                  asset["url"],
                  headers=headers
              )

              with urllib.request.urlopen(
                  req,
                  timeout=600
              ) as response:
                  return response.read()


          def get_release():
              if RELEASE_TAG:
                  url = (
                      f"https://api.github.com/repos/{REPO}"
                      f"/releases/tags/{RELEASE_TAG}"
                  )
              else:
                  url = (
                      f"https://api.github.com/repos/{REPO}"
                      "/releases/latest"
                  )

              release = request_json(url)

              if release.get("draft"):
                  sys.exit(
                      "Draft releases are not published to AltStore sources."
                  )

              if release.get("prerelease"):
                  sys.exit(
                      "Prereleases are intentionally skipped."
                  )

              return url, release


          def find_asset(release, pattern):
              matches = [
                  asset
                  for asset in release.get("assets", [])
                  if pattern.fullmatch(
                      asset.get("name", "")
                  )
              ]

              if len(matches) > 1:
                  names = ", ".join(
                      asset["name"]
                      for asset in matches
                  )

                  sys.exit(
                      f"Multiple IPA assets matched {pattern.pattern}: {names}"
                  )

              if not matches:
                  return None

              return matches[0]


          def wait_for_asset(release_url, release, pattern, label):
              # A release edited (e.g. notes) while still a draft can take longer than a
              # few seconds for the by-tag lookup to reflect its assets once published —
              # observed once taking several minutes for 0.5.1-b2. 20 attempts * 15s is
              # ~5 minutes of budget instead of the previous ~2.
              attempts = 20
              for attempt in range(attempts):
                  asset = find_asset(release, pattern)

                  if asset:
                      return release, asset

                  if attempt == attempts - 1:
                      return release, None

                  print(
                      f"Waiting for {label} IPA asset, "
                      f"attempt {attempt + 1}/{attempts}..."
                  )

                  time.sleep(15)
                  release = request_json(release_url)

              raise AssertionError("unreachable")


          def inspect_ipa(data):
              with zipfile.ZipFile(
                  io.BytesIO(data)
              ) as archive:

                  plist_paths = [
                      name
                      for name in archive.namelist()
                      if re.fullmatch(
                          r"Payload/[^/]+\.app/Info\.plist",
                          name
                      )
                  ]

                  if len(plist_paths) != 1:
                      sys.exit(
                          "Expected exactly one main app Info.plist, "
                          f"found {len(plist_paths)}."
                      )

                  plist = plistlib.loads(
                      archive.read(plist_paths[0])
                  )

              metadata = {
                  "bundleIdentifier": plist.get(
                      "CFBundleIdentifier"
                  ),
                  "version": plist.get(
                      "CFBundleShortVersionString"
                  ),
                  "buildVersion": plist.get(
                      "CFBundleVersion"
                  ),
                  "minOSVersion": plist.get(
                      "MinimumOSVersion"
                  ),
              }

              missing = [
                  key
                  for key in (
                      "bundleIdentifier",
                      "version",
                      "buildVersion",
                  )
                  if not metadata.get(key)
              ]

              if missing:
                  sys.exit(
                      "IPA Info.plist is missing: "
                      + ", ".join(missing)
                  )

              return {
                  key: (
                      str(value)
                      if value is not None
                      else None
                  )
                  for key, value in metadata.items()
              }


          def load_source(path, expected_bundle_id):
              if not path.exists():
                  sys.exit(
                      f"{path} is missing. "
                      "Commit the seed source first."
                  )

              with path.open(
                  encoding="utf-8"
              ) as file:
                  source = json.load(file)

              apps = source.get("apps")

              if not isinstance(apps, list) or len(apps) != 1:
                  sys.exit(
                      f"{path} must contain exactly one app."
                  )

              app = apps[0]

              if app.get(
                  "bundleIdentifier"
              ) != expected_bundle_id:
                  sys.exit(
                      f"{path}: expected bundleIdentifier "
                      f"{expected_bundle_id}, found "
                      f"{app.get('bundleIdentifier')!r}."
                  )

              return source, app


          def update_source(path, label, release, asset, expected_bundle_id):
              source, app = load_source(path, expected_bundle_id)

              blob = download_asset(asset)
              metadata = inspect_ipa(blob)

              if (
                  metadata["bundleIdentifier"]
                  != expected_bundle_id
              ):
                  sys.exit(
                      f"{label} IPA bundle ID is "
                      f"{metadata['bundleIdentifier']!r}, expected "
                      f"{expected_bundle_id!r}."
                  )

              version = metadata["version"]
              build_version = metadata["buildVersion"]
              download_url = asset["browser_download_url"]

              versions = app.get("versions") or []

              required_version_fields = {
                  "version",
                  "buildVersion",
                  "date",
                  "downloadURL",
                  "size",
              }

              clean_versions = []
              removed_legacy = False

              for index, old in enumerate(versions):
                  missing = sorted(
                      required_version_fields - old.keys()
                  )

                  if missing:
                      print(
                          f"~ {label}: dropping legacy "
                          f"versions[{index}] missing "
                          + ", ".join(missing)
                      )

                      removed_legacy = True
                      continue

                  clean_versions.append(old)

              versions = clean_versions
              app["versions"] = versions

              current = versions[0] if versions else None

              if (
                  current
                  and current.get("downloadURL")
                  == download_url
                  and current.get("version")
                  == version
                  and current.get("buildVersion")
                  == build_version
              ):
                  if removed_legacy:
                      with path.open(
                          "w",
                          encoding="utf-8"
                      ) as file:
                          json.dump(
                              source,
                              file,
                              indent=2,
                              ensure_ascii=False
                          )
                          file.write("\n")

                  print(
                      f"- {label}: already current "
                      f"({version} build {build_version})"
                  )

                  return removed_legacy

              if (
                  current
                  and current.get("downloadURL")
                  != download_url
                  and current.get("version")
                  == version
                  and current.get("buildVersion")
                  == build_version
              ):
                  sys.exit(
                      f"{label}: asset changed but version/build "
                      f"remained {version} ({build_version}). "
                      "Increment CFBundleVersion."
                  )

              notes = (
                  release.get("body") or ""
              ).strip()

              if not notes:
                  notes = f"Nuvio {label} {version}."

              entry = {
                  "version": version,
                  "buildVersion": build_version,
                  "date": release["published_at"],
                  "localizedDescription": notes[:3000],
                  "downloadURL": download_url,
                  "size": int(
                      asset.get("size") or len(blob)
                  ),
              }

              if metadata.get("minOSVersion"):
                  entry["minOSVersion"] = (
                      metadata["minOSVersion"]
                  )

              history = []

              for old in versions:
                  same_build = (
                      old.get("version") == version
                      and old.get("buildVersion")
                      == build_version
                  )

                  same_url = (
                      old.get("downloadURL")
                      == download_url
                  )

                  if not same_build and not same_url:
                      history.append(old)

              app["versions"] = [
                  entry
              ] + history

              with path.open(
                  "w",
                  encoding="utf-8"
              ) as file:
                  json.dump(
                      source,
                      file,
                      indent=2,
                      ensure_ascii=False
                  )
                  file.write("\n")

              print(
                  f"+ {label}: {version} "
                  f"build {build_version} "
                  f"({asset['name']})"
              )

              return True


          def validate_source(path, expected_bundle_id):
              with path.open(
                  encoding="utf-8"
              ) as file:
                  source = json.load(file)

              apps = source.get("apps")

              if not isinstance(apps, list) or len(apps) != 1:
                  sys.exit(
                      f"{path}: source must contain exactly one app."
                  )

              app = apps[0]

              if (
                  app.get("bundleIdentifier")
                  != expected_bundle_id
              ):
                  sys.exit(
                      f"{path}: incorrect bundleIdentifier."
                  )

              versions = app.get("versions")

              if (
                  not isinstance(versions, list)
                  or not versions
              ):
                  sys.exit(
                      f"{path}: versions must not be empty."
                  )

              required = {
                  "version",
                  "buildVersion",
                  "date",
                  "downloadURL",
                  "size",
              }

              seen = set()

              for index, version in enumerate(versions):
                  missing = sorted(
                      required - version.keys()
                  )

                  if missing:
                      sys.exit(
                          f"{path}: versions[{index}] "
                          "is missing "
                          + ", ".join(missing)
                      )

                  key = (
                      str(version["version"]),
                      str(version["buildVersion"]),
                  )

                  if key in seen:
                      sys.exit(
                          f"{path}: duplicate version/build "
                          f"pair {key}."
                      )

                  seen.add(key)

              print(
                  f"✓ {path} passed validation."
              )


          release_url, release = get_release()

          sources_to_check = (
              SOURCES
              if CHANNEL == "auto"
              else [s for s in SOURCES if s[2].lower() == CHANNEL]
          )

          any_matched = False
          any_changed = False

          for path, pattern, label, expected_bundle_id in sources_to_check:
              if CHANNEL == "auto":
                  # Real release events fire the instant the release is
                  # published, when the asset upload may not be visible via
                  # the API yet — worth a short retry.
                  release, asset = wait_for_asset(
                      release_url, release, pattern, label
                  )
              else:
                  # A dispatch that already names its channel is always run
                  # well after the release (and its asset) are fully live —
                  # no race to wait out.
                  asset = find_asset(release, pattern)

              if asset is None:
                  print(f"- {label}: no matching asset in this release, skipping.")
                  continue

              any_matched = True
              changed = update_source(path, label, release, asset, expected_bundle_id)
              any_changed = any_changed or changed
              validate_source(path, expected_bundle_id)

          if not any_matched:
              sys.exit(
                  f"No asset in this release matched the "
                  f"{'Full/Pro' if CHANNEL == 'auto' else CHANNEL} "
                  "IPA naming pattern."
              )

          print(
              "Source(s) updated."
              if any_changed
              else "No source changes."
          )
          PY

      - name: Commit and push AltStore sources
        run: |
          if git diff --quiet -- store-pro.json store-unmodified.json; then
            echo "No AltStore source changes."
            exit 0
          fi

          git add store-pro.json store-unmodified.json

          git commit -m \
            "chore: update AltStore source(s) $(date -u +%Y-%m-%dT%H:%MZ)"

          git pull --rebase origin pro
          git push origin "HEAD:pro"
